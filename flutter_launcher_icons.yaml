# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true # writes ic_launcher, the name AndroidManifest.xml uses
  image_path: "assets/images/new_logo.png"
  min_sdk_android: 21
  # Android 8+ cuts the icon into its own shape (circle, squircle…); the logo fills the whole layer.
  adaptive_icon_background: "#151a45"
  adaptive_icon_foreground: "assets/images/new_logo.png"
  adaptive_icon_foreground_inset: 0
